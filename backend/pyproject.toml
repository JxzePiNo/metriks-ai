[project]
name = "metriks-ai-backend"
version = "0.1.0"
description = "Metriks AI document management system - backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.20,<1",
    "cryptography>=44,<47",
    "lingua-language-detector>=2.1,<3",
]

[project.optional-dependencies]
rag = [
    "pymupdf>=1.25,<2",
    "presidio-analyzer>=2.2,<3",
    "elasticsearch>=8.17,<9",
    "sentence-transformers>=3.4,<6",
    "openai>=1.68,<3",
    "nemoguardrails>=0.12,<0.20",
    "langchain-openai>=0.3,<2",
    "dataclasses-json>=0.6,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
